<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="mfTitle">
  <title id="mfTitle">Market Forge</title>
  <!-- True vector mark, hand-authored. Anvil = the forge; candles struck off its
       face = the market. Two brand colours only: steel blue #4f9dff, heat orange
       #ff6a00. Transparent background, reads down to ~20px. -->
  <defs>
    <linearGradient id="mfHeat" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#ff5c00"/>
      <stop offset="1" stop-color="#ffab5e"/>
    </linearGradient>
    <linearGradient id="mfSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc2ff"/>
      <stop offset="1" stop-color="#3d7ed4"/>
    </linearGradient>
  </defs>

  <!-- candles rising off the struck face -->
  <g fill="url(#mfHeat)">
    <rect x="17.6" y="20"   width="4.8" height="9"  rx="1.5"/>
    <rect x="27.6" y="13"   width="4.8" height="16" rx="1.5"/>
    <rect x="37.6" y="6.5"  width="4.8" height="22.5" rx="1.5"/>
  </g>
  <g stroke="#ff6a00" stroke-width="1.7" stroke-linecap="round">
    <path d="M20 16v4"/>
    <path d="M30 9v4"/>
    <path d="M40 2.5v4"/>
  </g>

  <!-- sparks -->
  <g fill="#ff8a2b">
    <circle cx="48.5" cy="10.5" r="1.8"/>
    <circle cx="53"   cy="17"   r="1.1"/>
    <circle cx="47"   cy="19.5" r=".85"/>
  </g>

  <!-- anvil: wide struck face + horn, narrow waist, flared foot -->
  <path fill="url(#mfSteel)"
        d="M8 30h46v6H37l-1 8h10l2.5 7h-33l2.5-7h10l-1-8H8l-6-3z"/>
  <!-- hot strike line on the face -->
  <path d="M11 32.6h40" stroke="#ffd9b8" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
</svg>
